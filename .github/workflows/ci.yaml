name: CI - Tain and Save the model

on:
 push:
   branches: [main]
 pull_requests:
    branches: [main]

jons:
  matrax-pip:
    name: Tain and Save the model
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.11,3.12]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v4
        with:
           python-version: ${{ matrax.python}}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install project dependencies
        run: python -m pip install -f requirements.txt
      - name: Tain the model
        run: |
          pythom train.py
          ls -la artifacts
      - name: Upload artifacts
        uses: actions/upload-artifacts@v4
        with:
           name: ml-artifacts-{{ matrix.python }}-${{ github.run_id }}
      